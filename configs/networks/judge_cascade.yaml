name: judge_cascade
description: Six Haiku proposers; unanimous-enough tasks (5 of 6 agree) exit on the vote; contested ones
  go to a single aggregator that escalates to Sonnet when fewer than half agree. Cheap workers, an expensive
  specialist only on the hardest cases.
default_model: haiku
default_max_tokens: 3200
default_temperature: 0.0
stages:
- name: propose
  width: 6
  max_tokens: 3200
  system: 'You are one member of a team solving a problem. Work independently and be concise.

    End with a final line of the form "ANSWER: <answer>".

    '
  instruction: 'Your approach: {perspective}

    Solve the task above.

    '
  perspectives:
  - Work step by step from the given facts.
  - Write the key equations before computing anything.
  - Estimate the answer roughly first, then compute it exactly.
  - Work backwards from what the question asks for.
  - Track units and edge cases as you go.
  - Restate the problem in simpler terms, then solve it.
- name: aggregate
  width: 1
  max_tokens: 3200
  system: 'You combine your team''s solutions into one final answer. Prefer the answer with the best supporting
    reasoning, not just the most votes.

    End with a final line "ANSWER: <answer>".

    '
  instruction: 'Give the single final answer.

    '
  exit_if_agreement: 0.83
  escalate_to: sonnet_nothink   # P0-calibrated, thinking off; same ref as the single_sonnet control (session 2)
  escalate_below: 0.5
