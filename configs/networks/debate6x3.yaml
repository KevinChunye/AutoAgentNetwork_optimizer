name: debate6x3
description: >
  Phase 4A-lite (session E4): six Haiku agents, each with its own approach, answer independently, then debate for two more rounds. In rounds
  2 and 3 each agent reads the task first (the shared prefix), then every agent's answer from the round before
  (its own included), and answers again. A free plurality vote over the last round decides. Stopping after round
  r and a consensus exit between rounds are replayed offline from this dense run; edge-pruned versions set
  `edges` on the debate stage.
default_model: haiku_nothink
default_max_tokens: 4000
default_temperature: null
stages:
  - name: debate
    kind: debate
    width: 6
    rounds: 3
    max_tokens: 4000
    system: |
      You are one member of a team solving a problem. Be concise.
      End with a final line of the form "ANSWER: <answer>".
    instruction: |
      Your approach: {perspective}
      Solve the task above on your own.
    debate_instruction: |
      Your approach: {perspective}
      Above are the team's answers from the last round, yours among them. Check their reasoning against the task,
      keep or change your answer on the merits, and give your answer.
    perspectives:
      - Work step by step from the given facts.
      - Write down the key structure of the problem before computing anything.
      - Estimate the answer roughly first, then work it out exactly.
      - Work backwards from what the question asks for.
      - Track edge cases and exceptions as you go.
      - Restate the problem in simpler terms, then solve it.
  - name: vote
    kind: vote
    width: 1
