kind: phoenix_batch
name: fam_gpt_batch_rest_2
prereg:
  question: 'GPT family arm: with GPT-6.1 Sol (reasoning medium) as planner and a
    Luna / Sol low / Sol medium pool, after a member is shut down and Luna or Sol
    low withdrawn (F1), does PHOENIX full recovery give a better held-out balanced
    accuracy than fixed takeover and than LLM-chosen recovery at the same $1.00 budget,
    does the strong planner propose and run new pipelines, and at what cost? (research/phoenix_science/prereg.md,
    Family arms)'
  prediction: 'More branches run a model-proposed new pipeline than in the main study
    (luna_low_ev planner); full - fixed test points: interval includes 0 (not resolved);
    full - llm dollars negative; cost per branch above the main study''s and below
    $1.00.'
  kill: 'Stop and audit on test-label exposure, provenance or hash violation, unknown
    model charge, governor refusal or a failed gate (the first case per dataset, 9
    branches: any error_type, invalid or truncated replies above 10% of calls, a branch
    above its budget, a branch without a terminal status, or state not pushed); no
    retries.'
  decision: 'Paired 95% bootstrap over the 18 cases (10,000 resamples, seed 2026):
    lower bound > 0 -> full beats X; upper bound < 0 -> worse; else not resolved.
    Also full and llm of this arm minus the main study''s on its 15 evidence cases
    (the planner effect), and exploration counts per branch. Every contrast is reported.'
