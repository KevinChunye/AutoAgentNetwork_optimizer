# W2-A Sonnet arm (research/v3/plan_w2.md), run only if the phase has room after the Haiku sealed block:
# the trader and the risk manager with Sonnet 5.5 on sealed sequence 101, so S1, S2 and S3 can be
# compared with Haiku's on the same 200 events. No committee (S4) calls: six Sonnet calls per event cost too much.
kind: desk
name: w2a_sonnet_101
seeds: [101]
events: 200
structures: [S1, S2, S3]
model: sonnet_nothink
max_tokens: 800
temperature: 1.0
kelly_fraction: 0.5
max_usd: 2.4
chunk_events: 50
max_concurrency: 8
expect:
  min_calls: 100
  max_unparsed_rate: 0.05
  max_truncation_rate: 0.05
prereg:
  question: On sealed sequence 101, how do Sonnet 5.5 traders and risk managers (S1, S2, S3) compare with Haiku's
    on calibration, sizing and wealth?
  prediction: 'Sonnet''s ECE no worse than Haiku''s; its bias leans negative (OptimismBench: Sonnet 4.6 -7.7 points
    in vignettes, no lean with a numeric prior); its sizing error ratio of S3 to S1 within 0.15 of Haiku''s. About
    $1.0 actual.'
  kill: More than 5% of replies unparsed or truncated, or actual spend above 1.5x its projection from the smoke
    test's token counts at Sonnet prices, stops the run.
  decision: 'Descriptive only (decision rule 4): it runs only if the phase can absorb its worst case after the sealed
    block, and it changes no Haiku decision.'
