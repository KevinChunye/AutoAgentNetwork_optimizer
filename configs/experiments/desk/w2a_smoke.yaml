# W2-A smoke test (research/v3/plan_w2.md): the solo trader (S1) with Haiku on the first 20 events of
# tuning sequence 1. It checks the reply format and measures the cost per call before the full design.
kind: desk
name: w2a_smoke
seeds: [1]
events: 200
event_offset: 0
event_limit: 20
structures: [S1]
model: haiku_nothink
max_tokens: 400
temperature: 1.0
kelly_fraction: 0.5
max_usd: 0.5
chunk_events: 50
max_concurrency: 8
expect:
  min_calls: 10
  max_unparsed_rate: 0.05
  max_truncation_rate: 0.05
  max_spend_usd: 0.0045
prereg:
  question: Do Haiku traders read the W2-A event format and answer the four-line reply format (probability, side,
    stake), and what does one desk call cost?
  prediction: At most 1 of 20 replies unparsed, none truncated; about $0.00015 per call ($0.003 for 20).
  kill: More than 5% unparsed or truncated stops the run; actual spend above $0.0045 (1.5x the $0.003 projection)
    stops it.
  decision: 'Decision rule 3 of research/v3/plan_w2.md: at most 5% unparsed and at most $0.0005 per call continues
    to w2a_tune, with each later run''s kill line set to 1.5x its planned calls times the measured cost per call;
    otherwise re-size the plan first.'
