# Self-or-social pruning, test branch table plus the full-review control. Run only after frozen.json is committed.
# Slices sized by aan estimate so the worst case x1.15 stays under $2 (about 27 items; RUNBOOK.md).
kind: self_or_social
name: sos_test
tasks: data/external/bbeh_all.jsonl
items: research/self_or_social/sealed/test.txt
team:
- {id: A, ref: haiku_nothink, call: 0, max_tokens: 4000}
- {id: B, ref: haiku_low, call: 0, max_tokens: 12288}
- {id: C, ref: haiku_high, call: 0, max_tokens: 18432}
reuse_first: [results/e51_haiku_bbeh/calls.csv]
branches: true
full_review: true
parser: v2
disjoint_from: [research/self_or_social/sealed/dev.txt]
requires: [research/self_or_social/frozen.json]
max_usd: 4.0
chunk_size: 10
max_concurrency: 12
expect:
  min_calls: 20
  max_unparsed_rate: 0.10
  max_truncation_rate: 0.10
  usd_per_call: {haiku_nothink: 0.0005, haiku_low: 0.0012, haiku_high: 0.0018}
  max_cost_ratio: 2.0
prereg:
  question: 'Test of self-or-social pruning (research/self_or_social/prereg.md). On 240 test items never used to fit or
    choose anything, does the frozen policy (each member stops, reflects alone or consults one teammate, from its
    first-round agreement state) trade accuracy for dollars better than vote, all-reflect, fixed peer, random matched,
    full review and Sonnet low alone?'
  prediction: 'H1: policy accuracy within 2 points of all-reflect or better, at a lower cost per item. H2: policy above
    random matched (same number of reflects and consults per item). H3: fixed (directed) peer at least as accurate as the
    smartest peer. Expected differences are a few points; at n = 240 the intervals may include 0.'
  kill: 'Stop if a member and phase leaves over 10% of its live calls unparsed or truncated (after 20), costs over 2x its
    guard per call, the governor refuses, or the ledger shows spend above 1.5x the estimate: stop, audit, report.'
  decision: 'Read once with analysis/self_or_social.py read. If H1 holds, present the policy as a communication budget
    module for existing agent teams; if not, report that on these tasks social information does not pay over
    re-checking alone or voting. Labelled preregistered-descriptive (anchor items, not freshly sealed).'
