# P5 transfer smoke: dense + 3 pruned configs on luna_low (GPT-6 Luna, low reasoning), held-out items
# 60-69 (picks are made on the search half). PLACEHOLDER configs on the 1/3/6 grid: replace them with
# P4's joint pick, stage-by-stage pick and best uniform, then re-estimate and dry-run.
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p5_omni_transfer
network: configs/networks/dense_3x6.yaml
tasks: data/external/omni_d44_61.jsonl
task_offset: 60
task_limit: 10
model_override: luna_low
max_usd: 1.5
chunk_size: 5
max_concurrency: 8
configs:
- - 6
  - 3
  - 3
  - 1
- - 3
  - 3
  - 3
  - 1
- - 1
  - 1
  - 1
  - 1
expect:
  min_tasks: 5
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.02
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: Do the P4 picks keep their order on GPT-6 Luna at low reasoning (luna_low), and does the cost model
    hold there?
  prediction: Dense cost per task within 2x Haiku's actual; output tokens at most 2x visible; the 3 picks keep their
    error order (weak evidence, 10 items).
  kill: Hidden reasoning above 2x, or a price or model-ID surprise (aan models). Stop OpenAI work.
  decision: Runs only if P4 ran and P0's luna_low calibration passed (rule 26). Transfer is reported as feasibility
    only; mixed teams stay a post-pilot option.
