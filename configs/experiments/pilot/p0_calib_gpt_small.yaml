# P0 calibration: the single agent on calibration items 0-4 with model ref gpt_small.
# Measures hidden thinking/reasoning tokens, stop reasons, prompt-token estimate error, latency and
# rate limits (python -m analysis.calibration; status.json). 5 calls: read by hand, no early stop.
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p0_calib_gpt_small
network: configs/networks/single.yaml
tasks: data/external/omni_d44_61.jsonl
task_offset: 0
task_limit: 5
model_override: gpt_small
max_usd: 0.25
chunk_size: 5
max_concurrency: 8
expect:
  min_tasks: 1000
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.002
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: How does this model ref behave per call on calibration items 0-4 (hidden tokens, truncation, prompt-token
    estimate error, latency, rate limits)?
  prediction: 'haiku (default thinking): output tokens above 1.5x the visible estimate on at least 3 of 5 calls
    and at least 1 of 5 truncated at 800. haiku_nothink: within 1.3x, none truncated. haiku_low: in between. Actual
    prompt tokens 1.0x to 1.4x of estimated_prompt_tokens x 3/4. sonnet_nothink: within 1.3x, none truncated, under
    $0.01 per call. luna_low and gpt_small: output tokens at most 2x visible for luna_low. Latency 2 to 15 s per
    call.'
  kill: Any ref whose model ID is not listed by aan models, whose price differs from configs/pricing.yaml, or whose
    spend exceeds 1.5x its estimate is not used for paid work; stop and audit.
  decision: Choose the Haiku worker ref (haiku_nothink unless it truncates or is rejected, then haiku_low) and record
    it in plan.md; regenerate configs if it changes; size P4 parts from the rate limits in status.json.
