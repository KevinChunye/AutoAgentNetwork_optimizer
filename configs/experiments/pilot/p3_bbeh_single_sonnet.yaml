# P3 matched-cost senior control: one Sonnet 5.5 call (sonnet_nothink) per task on validation 20-59
# (amendment 3, rule 18). No model override: the network names its own ref.
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p3_bbeh_single_sonnet
network: configs/networks/single_sonnet.yaml
tasks: data/external/bbeh_gate.jsonl
task_offset: 20
task_limit: 40
max_usd: 2.0
chunk_size: 10
max_concurrency: 8
expect:
  min_tasks: 10
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.04
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: Does one Sonnet 5.5 call per task (the senior control) match the 19-call Haiku team on validation 20-59,
    and at what cost per task?
  prediction: Single Sonnet accuracy within 10 points of dense; its cost per task 1.0x to 2.0x dense's measured
    $0.0117 on BBEH (rule 58).
  kill: 'Rule 18 as amended by rule 58: Sonnet stops P4 only if its accuracy is at least dense''s (point estimate)
    and its cost per task is at most dense''s, on validation 20-59 only (Sonnet never runs on 100-119, so P3w does
    not enter this rule).'
  decision: 'Sonnet at least as accurate but dearer than dense: the report leads with it as a control, and P4 runs
    when rule 11 passes. Below dense by less than 5 points: P4 runs when rule 11 passes and the report leads with
    the senior control. Below dense by 5 points or more: rule 11 alone decides.'
