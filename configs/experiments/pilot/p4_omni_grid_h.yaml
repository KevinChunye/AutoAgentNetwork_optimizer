# P4 factorial landscape part h (held-out half): levels 1/3/6 per stage, 27 configs,
# 105 calls per task, on validation 90-99. The first half of the parts is the search half
# (20-59), the rest is held out (60-99). Dense calls on 20-59 come from the P3 cache; on 60-99 they are
# new. Part size and concurrency are set from P0's rate limits (amendment 3, rule 20).
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p4_omni_grid_h
network: configs/networks/dense_3x6.yaml
tasks: data/external/omni_d44_61.jsonl
task_offset: 90
task_limit: 10
model_override: haiku_nothink
max_usd: 4.0
chunk_size: 5
max_concurrency: 16
configs:
  levels:
  - 1
  - 3
  - 6
expect:
  min_tasks: 5
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.02
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: Where does the network's accuracy come from? Accuracy per doubling of each stage, stage interactions
    and value per dollar on a 3x3x3 factorial grid.
  prediction: (1) Proposers add the most accuracy per doubling and critique the least. (2) No interaction term is
    resolved (CIs include 0). (3) The equimarginal path reaches within 5 points of dense held-out error at no more
    than half the dense cost. (4) Effective team size of the propose stage is at most 3 (H6). (5) The joint pick
    and the stage-by-stage pick are within 5 held-out reward points of each other.
  kill: Dense error on these items outside the P3 estimate +-15 points, or a part's spend above 1.5x its estimate.
    Stop and audit.
  decision: If critique and refine add under 2 points per doubling, the vote and consensus designs are the main
    result and the scale-up option is a power-first test of them; otherwise static picks and H1 lead.
