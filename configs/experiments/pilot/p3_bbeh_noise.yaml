# P3 noise: dense on validation 20-29 twice (replicate 0 from cache, replicate 1 new).
# There is no temperature setting, so run-to-run noise is measured, not fixed.
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p3_bbeh_noise
network: configs/networks/dense_3x6.yaml
tasks: data/external/bbeh_gate.jsonl
task_offset: 20
task_limit: 10
model_override: haiku_nothink
max_usd: 2.0
chunk_size: 5
max_concurrency: 8
replicates: 2
expect:
  min_tasks: 5
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.06
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: How often does the dense network's final answer change between two independent runs on the same items
    (validation 20-29)?
  prediction: Replicates agree on at least 70% of the 10 items.
  kill: Agreement under 50%. Stop and audit, because single-sample landscape cells would then be mostly noise.
  decision: Report replicate agreement next to every landscape comparison.
