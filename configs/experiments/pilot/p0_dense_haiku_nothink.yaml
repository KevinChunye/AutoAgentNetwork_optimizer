# P0 calibration: the dense network on calibration items 0-1 with the chosen ref, for stop reasons at
# the amendment 6 caps (1600 tokens in every stage), per-stage output tokens and latency (they size P4: amendment 3, rule 20).
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p0_dense_haiku_nothink
network: configs/networks/dense_3x6.yaml
tasks: data/external/omni_d44_61.jsonl
task_offset: 0
task_limit: 2
model_override: haiku_nothink
max_usd: 0.25
chunk_size: 2
max_concurrency: 8
expect:
  min_tasks: 1000
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.02
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: Does the dense network truncate at the amendment 6 caps (1600 tokens in every stage, rules 30 and 35)
    with the chosen ref, and what are its per-stage output tokens and latency?
  prediction: No stage truncates more than 5% of calls; mean output tokens per call below 60% of max_tokens in every
    stage; one 19-call task finishes in under 90 s.
  kill: Truncation above 5% in any stage. Do not raise max_tokens; switch the ref or stop and ask Kevin.
  decision: Per-stage output tokens and the rate limits set the P4 part size and concurrency.
