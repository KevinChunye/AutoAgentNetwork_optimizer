# P4b live design: judge_cascade on held-out validation 80-99 (two slices, each in its own
# results directory; audit 15). Proposers are identical to the dense run's (cached); exits on
# 5-of-6 agreement; the aggregator escalates to sonnet_nothink below 1/2.
# Generated by scripts/make_pilot_configs.py; prereg copied from research/plan.md (amendment 3).
name: p4b_bbeh_judge_cascade_b
network: configs/networks/judge_cascade.yaml
tasks: data/external/bbeh_gate.jsonl
task_offset: 80
task_limit: 20
model_override: haiku_nothink
max_usd: 4.0
chunk_size: 10
max_concurrency: 8
expect:
  min_tasks: 10
  dense_error_range: null
  max_dense_cost_per_task_usd: 0.06
  max_truncation_rate: 0.05
  max_unparsed_rate: 0.1
prereg:
  question: Does escalating only contested tasks to Sonnet (judge_cascade) reach dense accuracy at no more than
    half its cost on the held-out half (H5)?
  prediction: Exit rate 40 to 70%, escalation rate 10 to 30%, held-out accuracy at least dense minus 3 points at
    no more than 50% of dense cost (rule 24).
  kill: Cost per task above dense's. Stop this design.
  decision: Record it in research/designs.md as a descriptive row; it triggers nothing by itself (rule 25).
