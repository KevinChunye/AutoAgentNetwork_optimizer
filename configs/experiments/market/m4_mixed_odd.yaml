# Market town m4_mixed_odd: prereg copied from research/market/plan.md by scripts/make_market_configs.py; edit the plan and the script, not this file.
kind: market
trader: llm
rounds: 8
max_tokens: 200
temperature: 1.0
name: m4_mixed_odd
condition: mixed_odd
prereg:
  question: With Sonnet on half of each side (A sessions, seeds 31 and 33, on the odd ranks; B sessions, seeds 32 and 34,
    on the even ranks; so every rank is Sonnet twice and Haiku twice), do Sonnet traders earn a larger share of their competitive-equilibrium
    profit than Haiku traders, and does mixing change efficiency?
  prediction: Pooled Sonnet profit / CE profit exceeds pooled Haiku profit / CE profit by at least 10 points (all 4 sessions
    together, point estimate); mean efficiency of the 4 mixed sessions not above M2's.
  kill: 'A session''s actual spend over 1.5x its re-projection after M1 (section 5), or a session with zero trades in every
    period: stop and audit. The run also stops itself after 3 periods in a row without a trade, or at over 10% unparsed or
    over 5% truncated replies (checked after every round). If the market''s actual spend so far plus this run''s re-projection
    passes $8, the run does not start.'
  decision: The gap is not interpreted if either model is over 5% unparsed or over 5% truncated in M4 (audit 27; rates by
    model are reported in the M4 tables). Exploitation is claimed only if the gap is at least 20 points and larger than every
    M2 placebo gap (the 6 splits of M2's 4 sessions into two A and two B sessions, labeled odd/even as in M4); on a ZI-C null
    this rule fires in 0.8% of draws, and the gap alone reaches 10 points in 10.3%. A gap of 10-20 points meets the prediction
    but is reported as not distinguishable from label noise at n = 4. The rank-pair interval is descriptive only. The breakdown
    (trade rate by model, price edge in Sonnet-Haiku trades) says whether the gap comes from who trades or from prices. Four
    sessions set no agent-company design rule; a gap over the bar is a reason to propose a larger M4 to Kevin. Then M3, unless
    money or time is short.
seeds: [31, 33]
periods: 5
model: haiku_nothink
senior_model: sonnet_nothink
senior_ranks: [1, 3, 5, 7, 9, 11]
max_usd: 3.0
expect:
  min_turns: 40
  max_unparsed_rate: 0.1
  max_truncation_rate: 0.05
  stop_after_zero_trade_periods: 3
